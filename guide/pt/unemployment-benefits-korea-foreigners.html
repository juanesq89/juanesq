  <h1 class="article-title">Seguro-Desemprego (실업급여) na Coreia para Estrangeiros: Quem Tem Direito e Quem Fica de Fora</h1>
  <div class="article-meta"><span>Por <strong>Juan</strong>, Advogado</span><span class="dot"></span><span>6 min de leitura</span><span class="dot"></span><span>English · Español · Português</span></div>
  <p class="article-lede">Você perdeu o emprego e alguém te disse para «dar entrada no seguro-desemprego». Na Coreia, se isso é sequer possível depende do seu tipo de visto e de como o vínculo de trabalho realmente terminou.</p>
  <div class="article-body">
    <p>O benefício de procura de emprego (구직급여), que é o que quase todo mundo chama de seguro-desemprego (실업급여), sai do sistema de Seguro de Emprego da Coreia (고용보험). Para os coreanos, a inscrição é praticamente automática assim que entram na folha de pagamento. Para trabalhadores estrangeiros, a cobertura depende muito da categoria de visto, e algumas categorias exigem uma etapa de adesão voluntária que muita gente só descobre que pulou quando já está sem emprego.</p>
    <h2><span class="n">→</span>A Cobertura Não É Igual Para Todos os Vistos</h2>
    <div class="section-rule"></div>
    <p>Trabalhadores estrangeiros com vistos de trabalho como o E-7 (특정활동) e a maioria dos vistos de emprego profissional ou regular geralmente são inscritos no Seguro de Emprego (고용보험) da mesma forma que os empregados coreanos: obrigatoriamente, com desconto na folha. Quem tem visto E-9 (emprego não profissional) teve historicamente um tratamento diferente: os componentes de estabilidade do emprego e de capacitação profissional do seguro são obrigatórios, mas a parte do benefício de procura de emprego (실업급여) já foi estruturada no passado como opcional, exigindo que o próprio trabalhador pedisse a adesão em vez de ser inscrito automaticamente. Titulares de vistos da série F — F-2, F-5, F-6 e o status de coreano no exterior (재외동포) — geralmente recebem o mesmo tratamento que os coreanos para fins de Seguro de Emprego. Como as regras sobre o E-9 em particular mudaram ao longo do tempo e podem variar conforme a prática de cada empregador, a única forma confiável de saber sua situação real é verificar a inscrição diretamente no serviço do Seguro de Emprego (고용보험 홈페이지) ou no centro de emprego local (고용센터), e não presumir com base apenas na categoria do visto.</p>
    <h2><span class="n">→</span>A Regra dos 180 Dias</h2>
    <div class="section-rule"></div>
    <p>Independentemente da nacionalidade, o teste básico é o mesmo: em geral você precisa de pelo menos 180 dias de emprego segurado (피보험 단위기간) dentro dos 18 meses anteriores ao seu desligamento. Os dias são contados com base nos dias efetivamente trabalhados sob emprego segurado, e não simplesmente pelo tempo de calendário desde a contratação, então lacunas, licenças não remuneradas ou pequenas pausas entre empregos podem afetar se você atinge o mínimo.</p>
    <h3>Vários Empregos Curtos Também Podem Contar</h3>
    <p>Se você passou por alguns empregadores e cada um te inscreveu no Seguro de Emprego, os períodos segurados geralmente podem ser somados para chegar aos 180 dias, desde que o intervalo entre os empregos não tenha zerado a sua janela de elegibilidade. Guarde seu próprio registro das datas de trabalho e peça a cada empregador que confirme a inscrição: os empregadores são obrigados a inscrever os empregados segurados, mas falhas de fiscalização acontecem, e um registro de inscrição faltando pode derrubar silenciosamente um pedido que, de outra forma, seria válido.</p>
    <h2><span class="n">1</span>O Motivo da Saída Pesa Mais Que os 180 Dias</h2>
    <div class="section-rule"></div>
    <p>O benefício de procura de emprego (구직급여) foi pensado para a perda involuntária do emprego. Se você pediu demissão voluntariamente sem um motivo justificado reconhecido por lei, em geral não tem direito, mesmo com bem mais de 180 dias de cobertura. Entre os motivos justificados que permitem que um pedido de demissão «voluntário» ainda se qualifique estão, por exemplo, salários não pagos, uma piora unilateral e significativa das condições de trabalho, assédio no trabalho ou a mudança do local de trabalho que torne o deslocamento inviável. Mas isso precisa ser documentado, não apenas alegado no balcão do centro de emprego.</p>
    <p class="pullquote">Os 180 dias de cobertura te levam até a prova. É como e por que o emprego terminou que decide se você passa nela.</p>
    <h2><span class="n">2</span>Procurar Emprego Ativamente Não É Mera Burocracia</h2>
    <div class="section-rule"></div>
    <p>Depois de aprovado, o benefício não é pago automaticamente durante todo o período: o beneficiário precisa se apresentar ao centro de emprego nas datas marcadas e comprovar procura ativa de emprego (구직활동) para continuar recebendo. Faltar a uma data de apresentação ou não demonstrar esforço suficiente de procura pode suspender ou encerrar os pagamentos antes do fim do período do benefício.</p>
    <h2><span class="n">→</span>O Que Fazer Antes de Presumir Que Você Está Coberto</h2>
    <div class="section-rule"></div>
    <ol><li><strong>Verifique sua inscrição real</strong> no site do Seguro de Emprego ou num centro de emprego local. Não presuma pelo tipo de visto, principalmente se você tem um E-9.</li><li><strong>Levante seu histórico de trabalho</strong> com todos os empregadores anteriores se você estiver perto dos 180 dias, porque os períodos segurados de vários empregos muitas vezes podem ser somados.</li><li><strong>Documente o motivo da sua saída</strong> (salários não pagos, assédio ou mudanças forçadas no contrato) se não foi uma simples dispensa.</li><li><strong>Não falte às datas de apresentação</strong> depois de aprovado: a exigência de procura ativa de emprego é cobrada de verdade, não é formalidade.</li></ol>
  </div>
